[package]
name = "desktop-label-app"
version = "0.1.0"
description = "Skywin Labels — product list and label printing, talking to the same server the web app and Mac/Android clients use."
authors = ["Skywin Biotech"]
edition = "2021"

[lib]
name = "desktop_label_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

name: Deploy to production

# Runs the exact same steps that were previously done by hand over SSH:
# pull the new commit, rebuild the app image, restart it. Triggers on any
# push to main, and can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.127.216.26
          username: root
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -e
            cd /root/skywin-bill
            git fetch origin
            git reset --hard origin/main
            docker compose up -d --build
